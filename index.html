<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HK Vision - Photography Slideshow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>H.K. Vision</h1>
    <p class="tagline">Photography Portfolio & Slideshow</p>
  </header>

  <nav class="section-nav">
    <button type="button" class="tab active" data-section="featured">Featured</button>
    <button type="button" class="tab" data-section="blog">Blog</button>
    <button type="button" class="tab" data-section="all">All Photos</button>
  </nav>

  <div id="loading" class="loading-spinner">
    <div class="spinner"></div>
    <p>Loading photos...</p>
  </div>

  <div id="error" class="error-message" hidden>
    <p>Failed to load photos. Please try again.</p>
    <button type="button" id="retry-btn">Retry</button>
  </div>

  <div id="slideshow-start-container" class="slideshow-start-container" hidden>
    <button type="button" id="start-slideshow-btn" class="start-slideshow-btn">&#9654; Start Slideshow</button>
    <button type="button" id="start-zen-btn" class="start-zen-btn">Zen View</button>
  </div>

  <main id="gallery" class="photo-grid" hidden></main>

  <div id="slideshow" class="slideshow-overlay" hidden>
    <!-- Same image scaled+blurred fills the letterbox bars ("ambient backdrop") -->
    <img id="slideshow-backdrop" class="slideshow-backdrop" src="" alt="" aria-hidden="true">
    <button type="button" class="slideshow-close" aria-label="Close">&times;</button>
    <button type="button" class="slideshow-prev" aria-label="Previous">&lsaquo;</button>
    <button type="button" class="slideshow-next" aria-label="Next">&rsaquo;</button>
    <div class="slideshow-content">
      <img id="slideshow-img" src="" alt="">
      <div class="slideshow-info">
        <h2 id="slideshow-title"></h2>
        <p id="slideshow-subtitle"></p>
        <p id="slideshow-date"></p>
      </div>
    </div>
    <div class="slideshow-controls">
      <button type="button" id="autoplay-btn">&#9654; Auto</button>
      <button type="button" id="fullscreen-btn" aria-label="Enter fullscreen">&#x26F6; Full</button>
      <span id="slideshow-counter"></span>
      <a id="slideshow-link" href="#" target="_blank" rel="noopener noreferrer">View on site</a>
    </div>
  </div>

  <!-- Zen fullscreen view: images only, no chrome -->
  <div id="zen" class="zen-overlay" hidden>
    <img id="zen-backdrop" class="zen-backdrop" src="" alt="" aria-hidden="true">
    <img id="zen-img-a" class="zen-img zen-img--active" src="" alt="">
    <img id="zen-img-b" class="zen-img" src="" alt="">
    <p class="zen-hint">Press <kbd>Esc</kbd> or click to exit &nbsp;&middot;&nbsp; <kbd>&#8594;</kbd> skip &nbsp;&middot;&nbsp; <button type="button" id="zen-fullscreen-btn" class="zen-fullscreen-btn">&#x26F6; Full</button></p>
  </div>

  <footer class="site-footer">
    <p>&copy; Hossain Khan | <a href="https://vision.hossainkhan.com">vision.hossainkhan.com</a></p>
  </footer>

  <script src="js/app.js" defer></script>
</body>
</html>
