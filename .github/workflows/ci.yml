name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate site content
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── JavaScript ─────────────────────────────────────────────────────────
      - name: Check JavaScript syntax
        run: node --check js/app.js

      # ── HTML ───────────────────────────────────────────────────────────────
      - name: Validate HTML
        run: npx --yes html-validate@9 index.html

      # ── CSS ────────────────────────────────────────────────────────────────
      - name: Lint CSS
        run: npx --yes stylelint@16 "css/*.css"
